server:
  port: 19011

spring:
  application:
    name: userservice
  config:
    import:
      - optional:configserver:http://localhost:8888  # 추가
      - optional:file:.env[.properties]              # 1. 현재 폴더 기준 (user-service 단독 실행 시)
      - optional:file:user-service/.env[.properties] # 2. 상위 폴더 기준 (Final 전체 실행 시)

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${USER_DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

logging:
  level:
    org.flywaydb: info

eureka:
  instance:
    prefer-ip-address: false
    hostname: ${HOSTNAME:localhost}
  client:
    register-with-eureka: true
    fetch-registry: true
    serviceUrl:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8000/eureka/}
